services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: nexus-ams-discord:local
    init: true
    restart: unless-stopped
    stop_grace_period: 320s
    env_file:
      - .env
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m
    volumes:
      - ./data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
