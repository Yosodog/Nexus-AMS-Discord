name: Publish Nexus Discord release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Build production artifact
        run: bash scripts/build-release.sh "${GITHUB_REF_NAME}"
      - name: Publish fixed release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "${RELEASE_TAG}" dist/nexus-discord.tar.gz --verify-tag --generate-notes --title "Nexus ${RELEASE_TAG}"
