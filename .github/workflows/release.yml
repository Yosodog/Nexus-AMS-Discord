name: Publish Nexus Discord release

on:
  push:
    tags:
      - 'v*'
  # Called by cut-release.yml, whose GITHUB_TOKEN tag push triggers nothing.
  workflow_call:
    inputs:
      tag:
        description: 'Existing v* tag to build and publish'
        type: string
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Build production artifact
        run: bash scripts/build-release.sh "${RELEASE_TAG}"
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          [[ "${RELEASE_TAG}" == *-* ]] && prerelease=(--prerelease)
          gh release create "${RELEASE_TAG}" dist/nexus-discord.tar.gz dist/nexus-release.json \
            --verify-tag --generate-notes --title "Nexus Discord ${RELEASE_TAG}" "${prerelease[@]}"
